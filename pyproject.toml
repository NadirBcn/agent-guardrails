[project]
name = "agent-guardrails"
version = "0.1.0"
description = "Guardrails for agents that act in the real world: approval gates, reserve-then-settle spend caps, audit log, kill rules."
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
